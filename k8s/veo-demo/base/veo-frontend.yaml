apiVersion: apps/v1
kind: Deployment
metadata:
  name: veo-frontend
  namespace: veo-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: veo-frontend
  template:
    metadata:
      labels:
        app: veo-frontend
    spec:
      containers:
      - name: veo-frontend
        image: veo-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: veo-frontend
  namespace: veo-demo
  annotations:
    cloud.google.com/backend-config: '{"default": "veo-demo-backend-config"}'
spec:
  selector:
    app: veo-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
