apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veo-demo-ingress
  namespace: veo-demo
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: workflow-api
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: veo-frontend
            port:
              number: 80
